[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-vault-local"
version = "1.0.5"
description = "Restic-backed Codex history and project preservation with verified recovery"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-vault = "codex_vault.cli:main"

[tool.setuptools.packages.find]
include = ["codex_vault*"]
